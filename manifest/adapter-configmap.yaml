apiVersion: v1
kind: ConfigMap
metadata:
  name: adapter-config
data:
  # Existing Devtron CI trigger configuration - retained for /adapter/lccnsub
  DEVTRON_URL: "https://preview.devtron.ai/orchestrator/app/ci-pipeline/trigger"
  DEVTRON_VERIFY_SSL: "false"
  REQUEST_TIMEOUT: "10"
  REST_REQ_BODY: |
    {
      "pipelineId": 337,
      "ciPipelineMaterials": [
        {
          "Id": 344,
          "GitCommit": {
            "Commit": "1df32f437520f3d5f7d379511bdcb76ebf851cfb"
          }
        }
      ],
      "invalidateCache": false,
      "pipelineType": "CI_BUILD",
      "runtimeParams": {
        "runtimePluginVariables": []
      }
    }

  # Keystone / Tacker settings. These map to the working scripts:
  # - pm_job_create/vnf_pm_job_create.sh
  # - pm_report_fetch/vnf_pm_report_fetch.sh
  # - heal_script/vnf_heal.sh
  TACKER_AUTH_MODE: "keystone"
  KEYSTONE_URL: "http://localhost/identity/v3/auth/tokens"
  KEYSTONE_USER_DOMAIN_ID: "default"
  KEYSTONE_PROJECT_NAME: "nfv"
  KEYSTONE_PROJECT_DOMAIN_ID: "default"
  KEYSTONE_VERIFY_SSL: "false"
  KEYSTONE_TOKEN_CACHE_SECONDS: "300"

  TACKER_PROTOCOL: "http"
  TACKER_HOST: "10.0.0.108"
  TACKER_PORT: "9890"
  TACKER_API_VERSION: "v2"
  TACKER_USER_AGENT: "python-tackerclient"
  TACKER_API_VERSION_HEADER: "2.0.0"
  TACKER_VERIFY_SSL: "false"
  TACKER_REQUEST_TIMEOUT: "10"

  # PM job creation in Tacker.
  # Both URL and request body are configurable, so VNF ID, callback URL,
  # metric, Prometheus host, Alertmanager host, and reload endpoint can be
  # changed without code changes.
  PM_JOB_CREATE_ON_STARTUP: "true"
  PM_JOB_CREATE_STARTUP_DELAY_SECONDS: "2"
  TACKER_PM_JOB_URL: "http://10.0.0.108:9890/vnfpm/v2/pm_jobs"
  TACKER_PM_JOB_BODY: |
    {
      "objectType": "Vnf",
      "objectInstanceIds": [
        "7beb68bb-6b40-47e2-9e41-6312689407c6"
      ],
      "subObjectInstanceIds": [],
      "criteria": {
        "performanceMetric": [
          "VCpuUsageMeanVnf.7beb68bb-6b40-47e2-9e41-6312689407c6"
        ],
        "performanceMetricGroup": [
          "VirtualisedComputeResource"
        ],
        "collectionPeriod": 60,
        "reportingPeriod": 60,
        "reportingBoundary": "2026-12-31T00:00:00Z"
      },
      "callbackUri": "http://api-service/api/pm/callback",
      "authentication": {
        "authType": [
          "BASIC"
        ],
        "paramsBasic": {
          "userName": "ubuntu",
          "password": "ubuntu"
        }
      },
      "metadata": {
        "monitoring": {
          "monitorName": "prometheus",
          "driverType": "external",
          "targetsInfo": [
            {
              "prometheusHost": "10.0.0.75",
              "prometheusHostPort": 22,
              "alertmanagerHost": "10.0.0.75",
              "authInfo": {
                "ssh_username": "ubuntu",
                "ssh_password": "ubuntu"
              },
              "alertRuleConfigPath": "/etc/prometheus/rules",
              "prometheusReloadApiEndpoint": "http://10.110.214.67:9090/-/reload"
            }
          ]
        }
      }
    }

  # Tacker validates and sends PM notifications to this callback.
  PM_CALLBACK_USERNAME: "ubuntu"

  # Pushgateway / Prometheus endpoint used after fetching PM report from Tacker.
  PUSHGATEWAY_BASE_URL: "http://localhost:9091"
  PUSHGATEWAY_VERIFY_SSL: "false"

  # Devtron action configuration.
  # Adapter only invokes Devtron jobs. Devtron job implementation performs
  # actual heal/migrate by invoking Tacker internally.
  DEFAULT_DEVTRON_ACTION: "heal"
  DEVTRON_ACTIONS: |
    {
      "heal": {
        "type": "devtron",
        "url": "https://preview.devtron.ai/orchestrator/app/ci-pipeline/trigger",
        "verify_ssl": false,
        "body": {
          "pipelineId": 337,
          "ciPipelineMaterials": [
            {
              "Id": 344,
              "GitCommit": {
                "Commit": "1df32f437520f3d5f7d379511bdcb76ebf851cfb"
              }
            }
          ],
          "invalidateCache": false,
          "pipelineType": "CI_BUILD",
          "runtimeParams": {
            "runtimePluginVariables": [
              {
                "name": "ACTION",
                "value": "heal"
              }
            ]
          }
        }
      },
      "migrate": {
        "type": "devtron",
        "url": "https://preview.devtron.ai/orchestrator/app/ci-pipeline/trigger",
        "verify_ssl": false,
        "body": {
          "pipelineId": 337,
          "ciPipelineMaterials": [
            {
              "Id": 344,
              "GitCommit": {
                "Commit": "1df32f437520f3d5f7d379511bdcb76ebf851cfb"
              }
            }
          ],
          "invalidateCache": false,
          "pipelineType": "CI_BUILD",
          "runtimeParams": {
            "runtimePluginVariables": [
              {
                "name": "ACTION",
                "value": "migrate"
              }
            ]
          }
        }
      }
    }
