# ============================================================
# PM Job Create - Configuration File
# pm_job_config.conf
# ============================================================

# ----------------------------
# Keystone Authentication
# ----------------------------
KEYSTONE_URL=http://localhost/identity/v3/auth/tokens
USERNAME=nfv_user
PASSWORD=devstack
USER_DOMAIN_ID=default
PROJECT_NAME=nfv
PROJECT_DOMAIN_ID=default

# ----------------------------
# Tacker PM API Endpoint
# ----------------------------
PROTOCOL=http
HOST=10.0.0.108
PORT=9890
API_VERSION=v2
USER_AGENT=python-tackerclient
API_VERSION_HEADER=2.0.0

# ----------------------------
# PM Job - Object Configuration
# ----------------------------
# VNF Instance ID to monitor
VNF_INSTANCE_ID=7beb68bb-6b40-47e2-9e41-6312689407c6

# Object type (Vnf / VnfInstance etc.)
OBJECT_TYPE=Vnf

# Performance metric to collect
# Format: VCpuUsageMeanVnf.<VNF_INSTANCE_ID>
PERFORMANCE_METRIC=VCpuUsageMeanVnf.7beb68bb-6b40-47e2-9e41-6312689407c6

# Performance metric group
PERFORMANCE_METRIC_GROUP=VirtualisedComputeResource

# Collection period in seconds (how often metrics are collected)
COLLECTION_PERIOD=60

# Reporting period in seconds (how often reports are generated)
# Must be equal to or a multiple of COLLECTION_PERIOD
REPORTING_PERIOD=60

# Reporting boundary - ISO 8601 datetime after which reporting stops
REPORTING_BOUNDARY=2026-12-31T00:00:00Z

# ----------------------------
# Callback Configuration
# ----------------------------
# Devtron callback API endpoint (must be reachable from Tacker)
CALLBACK_URI=http://<DEVTRON_HOST>/api/pm/callback

# Callback authentication type: BASIC | OAUTH2_CLIENT_CREDENTIALS | OAUTH2_CLIENT_CERT
AUTH_TYPE=BASIC

# Credentials for BASIC auth on the callback endpoint
CALLBACK_USERNAME=ubuntu
CALLBACK_PASSWORD=ubuntu

# ----------------------------
# Prometheus / Alertmanager Metadata
# ----------------------------
MONITOR_NAME=prometheus
DRIVER_TYPE=external

# Prometheus server IP and SSH port
PROMETHEUS_HOST=10.0.0.75
PROMETHEUS_HOST_PORT=22

# Alertmanager server IP
ALERTMANAGER_HOST=10.0.0.75

# SSH credentials to Prometheus/Alertmanager host
SSH_USERNAME=ubuntu
SSH_PASSWORD=ubuntu

# Path where alert rules are stored on the Prometheus host
ALERT_RULE_CONFIG_PATH=/etc/prometheus/rules

# Prometheus reload API endpoint
PROMETHEUS_RELOAD_API=http://10.110.214.67:9090/-/reload
