# ============================================================
# PM Report Fetch - Configuration File
# pm_report_config.conf
# ============================================================

# ----------------------------
# Keystone Authentication
# ----------------------------
KEYSTONE_URL=http://localhost/identity/v3/auth/tokens
USERNAME=nfv_user
PASSWORD=devstack
USER_DOMAIN_ID=default
PROJECT_NAME=nfv
PROJECT_DOMAIN_ID=default

# ----------------------------
# Tacker PM API Endpoint
# ----------------------------
PROTOCOL=http
HOST=10.0.0.108
PORT=9890
API_VERSION=v2
USER_AGENT=python-tackerclient
API_VERSION_HEADER=2.0.0

# ----------------------------
# PM Report Fetch Parameters
# ----------------------------
# PM Job ID — obtained from the PM Job Create response
# or from the PerformanceInformationAvailableNotification (pmJobId field)
PM_JOB_ID=4a876fea-b0c2-4471-899c-2ab02f2cce62

# Report ID — obtained from the PerformanceInformationAvailableNotification
# _links.performanceReport.href field (last path segment)
REPORT_ID=fae1a25e-2761-4140-8f19-c095c83ee7d7

# ----------------------------
# Output Options
# ----------------------------
# Set to "true" to save the full report JSON to a file in the current directory
SAVE_REPORT_TO_FILE=true

# Filename for saved report (leave blank to auto-generate using PM_JOB_ID + REPORT_ID)
# Example: pm_report_output.json
# Leave blank for: pm_report_<PM_JOB_ID>_<REPORT_ID>.json
REPORT_OUTPUT_FILE=
